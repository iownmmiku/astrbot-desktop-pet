<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' petmodel:; img-src 'self' data: petmodel:; media-src 'self' petmodel:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AstrBot 桌宠</title>
  <link rel="stylesheet" href="pet.css">
  <script src="../vendor/pixi.min.js" defer></script>

</head>

        <path d="M132 80 L135 99 M151 78 L151 99 M170 80 L167 99" stroke="#dfc69d" stroke-width="6" stroke-linecap="round"/>

      </svg>
    </div>
  </div>
  <div id="sleep-badge" hidden title="正在睡觉，精力会逐渐恢复">☾ Zzz</div>
  <div class="pet-toolbar"><span id="pet-status" title="连接状态"></span><button id="open-control" aria-label="打开控制台" title="打开控制台">✿</button></div>
</body>
</html>

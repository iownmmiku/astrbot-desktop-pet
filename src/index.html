<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AstrBot 桌宠</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #canvas-wrap { position: absolute; inset: 0; }
  #canvas-wrap, canvas { display: block; width: 100%; height: 100%; }

  #bubble {
    position: absolute; left: 50%; top: 4px; transform: translateX(-50%) translateY(-4px);
    max-width: 260px; padding: 8px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.96); color: #333; font: 13px/1.5 "Microsoft YaHei", sans-serif;
    box-shadow: 0 3px 12px rgba(0,0,0,0.28); white-space: pre-wrap; word-break: break-all;
    z-index: 10; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
    border: 4px solid transparent; border-top: 8px solid rgba(255,255,255,0.96);
  }

  #chat-panel {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    display: none; gap: 6px; z-index: 10;
  }
  #chat-input {
    width: 200px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 14px;
    font: 13px "Microsoft YaHei", sans-serif; outline: none;
  }
  #chat-send {
    padding: 6px 12px; border: none; border-radius: 14px; background: #4a90d9; color: #fff;
    font: 13px "Microsoft YaHei", sans-serif; cursor: pointer;
  }

  #status-panel {
    position: absolute; left: 6px; top: 6px; z-index: 10;
    background: rgba(20,21,26,0.82); color: #fff; border-radius: 10px; padding: 10px 12px;
    font: 11px/1.9 "Microsoft YaHei", sans-serif; display: none; min-width: 150px;
    backdrop-filter: blur(4px); box-shadow: 0 3px 12px rgba(0,0,0,0.35);
  }
  #status-panel b { font-size: 12px; }
  .bar { display: flex; align-items: center; gap: 6px; }
  .bar label { width: 30px; }
  .bar .track { flex: 1; height: 7px; background: rgba(255,255,255,0.18); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 4px; transition: width .4s ease, background .4s; }

  #conn-dot {
    position: absolute; right: 8px; top: 8px; width: 10px; height: 10px; border-radius: 50%;
    background: #999; z-index: 10; cursor: pointer;
  }
  #conn-dot.ok { background: #4caf50; }
  #conn-dot.bad { background: #f44336; }

  #settings-panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 260px; max-height: 92%; overflow-y: auto; background: rgba(30,30,34,0.95); color: #eee; border-radius: 10px;
    padding: 12px 14px; font: 12px/1.6 "Microsoft YaHei", sans-serif; display: none; z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #settings-panel h3 { margin: 0 0 8px; font-size: 13px; }
  #settings-panel .row { margin-bottom: 8px; }
  #settings-panel label { display: block; margin-bottom: 2px; color: #aaa; }
  #settings-panel input[type=text], #settings-panel input[type=password], #settings-panel textarea {
    width: 100%; box-sizing: border-box; padding: 5px 8px; border: 1px solid #555;
    border-radius: 6px; background: #222; color: #eee; font: 12px "Microsoft YaHei", sans-serif; outline: none;
  }
  #settings-panel .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  #settings-panel button {
    padding: 5px 14px; border: none; border-radius: 6px; cursor: pointer; font: 12px "Microsoft YaHei", sans-serif;
  }
  #settings-save { background: #4a90d9; color: #fff; }
  #settings-cancel { background: #555; color: #eee; }
  #settings-hint { color: #888; font-size: 11px; margin-top: 6px; }

  /* ---------- 右键菜单 ---------- */
  #ctx-menu {
    position: absolute; display: none; z-index: 30; min-width: 132px;
    background: rgba(24,25,30,0.96); border: 1px solid #3a3c46; border-radius: 10px;
    padding: 5px; box-shadow: 0 6px 20px rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    font: 12px/1.6 "Microsoft YaHei", sans-serif;
  }
  #ctx-menu .item {
    padding: 6px 12px; border-radius: 6px; color: #dde; cursor: pointer; white-space: nowrap;
  }
  #ctx-menu .item:hover { background: #2b5ea7; color: #fff; }
  #ctx-menu .sep { height: 1px; background: #3a3c46; margin: 4px 6px; }

  /* ---------- 让TA说 输入框 ---------- */
  #say-panel {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    display: none; gap: 6px; z-index: 10;
  }
  #say-input {
    width: 200px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 14px;
    font: 13px "Microsoft YaHei", sans-serif; outline: none;
  }
  #say-send {
    padding: 6px 12px; border: none; border-radius: 14px; background: #7b5ea7; color: #fff;
    font: 13px "Microsoft YaHei", sans-serif; cursor: pointer;
  }
</style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="bubble"></div>
  <div id="status-panel"></div>
  <div id="chat-panel">
    <input id="chat-input" placeholder="和桌宠说点什么…" maxlength="200" />
    <button id="chat-send">发送</button>
  </div>
  <div id="conn-dot" title="连接状态（双击打开控制面板）"></div>
  <div id="say-panel">
    <input id="say-input" placeholder="让桌宠说点什么…" maxlength="100" />
    <button id="say-send">说</button>
  </div>
  <div id="ctx-menu">
    <div class="item" data-act="feed">🍖 投喂</div>
    <div class="item" data-act="play">🖐 摸摸头</div>
    <div class="item" data-act="clean">🛁 洗澡</div>
    <div class="item" data-act="sleep">💤 睡觉</div>
    <div class="item" data-act="poke">👉 戳一戳</div>
    <div class="sep"></div>
    <div class="item" data-act="say">💬 让TA说…</div>
    <div class="item" data-act="chat">✉️ 聊天</div>
    <div class="item" data-act="status">📊 状态面板</div>
    <div class="sep"></div>
    <div class="item" data-act="panel">⚙️ 控制面板</div>
  </div>

  <script src="../vendor/live2d.min.js"></script>
  <script src="../vendor/live2dcubismcore.min.js"></script>
  <script src="../node_modules/pixi.js/dist/pixi.min.js"></script>
  <script src="../node_modules/pixi-live2d-display/dist/index.min.js"></script>
  <script src="pet.js"></script>
</body>
</html>
